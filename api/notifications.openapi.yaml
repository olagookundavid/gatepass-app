openapi: 3.1.0
info:
  title: Gatepass Notifications API
  version: 1.0.0
  description: >
    The caller's notification log, e-mail preferences and ticket download links.
    Public routes live under /notifications/v1 and need a Cognito ACCESS token.
    Errors are RFC 9457 application/problem+json.
servers:
  - url: https://api.example.com
security:
  - bearer: []
paths:
  /notifications/v1/me/notifications:
    get:
      operationId: notificationsListMine
      summary: The caller's notification log, newest first
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
                  nextCursor: {type: string}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /notifications/v1/me/preferences:
    get:
      operationId: notificationsGetPreferences
      summary: Get preferences (default emailEnabled=true)
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '401': {$ref: '#/components/responses/Problem'}
    put:
      operationId: notificationsPutPreferences
      summary: Replace preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailEnabled]
              additionalProperties: false
              properties:
                emailEnabled: {type: boolean}
      responses:
        '200':
          description: Stored preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /notifications/v1/orders/{orderId}/ticket-url:
    parameters:
      - {name: orderId, in: path, required: true, schema: {type: string}}
    get:
      operationId: notificationsGetTicketUrl
      summary: Fresh presigned download URL for the caller's ticket (valid 5 minutes)
      description: 404 if the ticket does not exist yet, or belongs to someone else.
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        requestId: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    Preferences:
      type: object
      required: [emailEnabled]
      properties:
        emailEnabled: {type: boolean}
        updatedAt: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, type, orderId, channel, status, createdAt]
      properties:
        id: {type: string}
        type: {type: string, enum: [order_paid, payment_failed, order_cancelled]}
        orderId: {type: string}
        channel: {type: string, enum: [email]}
        status: {type: string, enum: [sent, skipped, failed]}
        reason: {type: string, description: "Why skipped or failed, e.g. email_disabled, address_rejected, no_email_address"}
        createdAt: {type: string, format: date-time}
