openapi: 3.1.0
info:
  title: Gatepass Catalog API
  version: 1.0.0
  description: >
    Venues, events and ticket types. Public routes live under /catalog/v1.
    Errors are RFC 9457 application/problem+json. Authentication is a Cognito
    ACCESS token in "Authorization: Bearer"; admin = group "admin".
servers:
  - url: https://api.example.com
security: []
paths:
  /catalog/v1/events:
    get:
      operationId: catalogListEvents
      summary: List published events (public, first page cached 60 s)
      parameters:
        - {name: city, in: query, schema: {type: string, maxLength: 100}}
        - {name: from, in: query, description: "RFC 3339 or YYYY-MM-DD", schema: {type: string}}
        - {name: to, in: query, description: "RFC 3339 or YYYY-MM-DD", schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
        '422': {$ref: '#/components/responses/Problem'}
    post:
      operationId: catalogCreateEvent
      summary: Create a draft event with ticket types (admin)
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEvent'}
      responses:
        '201':
          description: Created draft
          headers:
            ETag: {schema: {type: string}, description: The event version, e.g. "1"}
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /catalog/v1/events/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    get:
      operationId: catalogGetEvent
      summary: Get one event (public if published; admins also see drafts)
      security: [{}, {bearer: []}]
      responses:
        '200':
          description: The event
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: catalogUpdateEvent
      summary: Partially update an event (admin, optimistic locking)
      description: Send the version you read in If-Match. Ticket types and venueId only while the event is a draft.
      security: [{bearer: []}]
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: 'ETag from GET, e.g. "3"'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateEvent'}
      responses:
        '200':
          description: Updated event
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /catalog/v1/events/{eventId}/publish:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      operationId: catalogPublishEvent
      summary: Publish a draft (admin). Idempotent; repeating it re-announces EventPublished.
      security: [{bearer: []}]
      responses:
        '200':
          description: Published event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503':
          description: Published in the database but the EventPublished announcement failed; repeat the call.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /catalog/v1/events/{eventId}/image-upload-url:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      operationId: catalogImageUploadUrl
      summary: Presigned S3 PUT URL for an event image (admin)
      description: >
        PUT the file to uploadUrl with exactly the Content-Type and Content-Length requested.
        Then PATCH the event with imageUrl = publicUrl.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, contentLength]
              additionalProperties: false
              properties:
                contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
                contentLength: {type: integer, minimum: 1, maximum: 5242880}
      responses:
        '200':
          description: Upload target
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, objectKey, publicUrl, expiresAt]
                properties:
                  uploadUrl: {type: string, format: uri}
                  objectKey: {type: string}
                  publicUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
        '422': {$ref: '#/components/responses/Problem'}
  /catalog/v1/venues:
    get:
      operationId: catalogListVenues
      summary: List venues (public)
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: A page of venues
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Venue'}}
                  nextCursor: {type: string}
    post:
      operationId: catalogCreateVenue
      summary: Create a venue (admin)
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, city, address, capacity]
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 200}
                city: {type: string, maxLength: 100}
                address: {type: string, maxLength: 300}
                capacity: {type: integer, minimum: 1, maximum: 1000000}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Venue'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventId: {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Cursor: {name: cursor, in: query, description: Opaque cursor from nextCursor, schema: {type: string}}
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, examples: ["urn:gatepass:problem:validation_failed"]}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        requestId: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, reason]
            properties:
              field: {type: string}
              reason: {type: string}
    Venue:
      type: object
      required: [id, name, city, address, capacity, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        city: {type: string}
        address: {type: string}
        capacity: {type: integer}
        createdAt: {type: string, format: date-time}
    TicketType:
      type: object
      required: [id, name, priceCents, currency, capacity]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        priceCents: {type: integer, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        capacity: {type: integer, minimum: 1}
    TicketTypeInput:
      type: object
      required: [name, priceCents, currency, capacity]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 100}
        priceCents: {type: integer, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        capacity: {type: integer, minimum: 1}
    Event:
      type: object
      required: [id, venueId, title, description, startsAt, endsAt, status, createdAt, updatedAt, version, ticketTypes]
      properties:
        id: {type: string, format: uuid}
        venueId: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [draft, published, cancelled]}
        imageUrl: {type: string}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer}
        ticketTypes: {type: array, items: {$ref: '#/components/schemas/TicketType'}}
    EventPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Event'}}
        nextCursor: {type: string}
    CreateEvent:
      type: object
      required: [venueId, title, startsAt, endsAt, ticketTypes]
      additionalProperties: false
      properties:
        venueId: {type: string, format: uuid}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        ticketTypes: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/TicketTypeInput'}}
    UpdateEvent:
      type: object
      additionalProperties: false
      properties:
        venueId: {type: string, format: uuid}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        imageUrl: {type: string}
        ticketTypes: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/TicketTypeInput'}}
