# REUSABLE WORKFLOW: build, publish, sign and announce ONE service image. Every service calls
# this file (release.yaml has the list), so the supply-chain steps are written and reviewed once.
#
#   1. Log in to AWS with the OIDC role `ci-release` (no keys anywhere). That role can only be
#      assumed by a run on the main branch of this repository (00-bootstrap/github_oidc.tf).
#   2. Build a multi-architecture image (amd64 + arm64) with the repository's Dockerfile and push
#      it to ECR under the immutable tag sha-<7 characters of the commit>.
#   3. IDEMPOTENT: if that tag already exists (a re-run of the same commit) the build is skipped and
#      the existing digest is used. Immutable tags would reject a second, different push, and a
#      re-run must not produce a different image.
#   4. Sign the image by DIGEST with cosign "keyless": the signature proves THIS workflow on THIS
#      repository's main branch built it. Attach the SBOM (list of every package inside) as a signed
#      attestation. Both are stored in ECR next to the image.
#   5. Open a pull request in the gitops repository that pins the new tag and digest in
#      apps/<service>/dev.yaml, and turn on auto-merge. Argo CD deploys after the merge.
#
# NOTHING in this file contains an account id: the role ARN and region come from repository
# VARIABLES (Settings > Secrets and variables > Actions > Variables), the registry host from the
# ECR login step. The only secret is the GitHub App private key used for step 5.
#
# Related: release.yaml (the caller), pr.yaml (checks before merge), build/Dockerfile,
# gatepass-infra/00-bootstrap (ECR, roles), gatepass-gitops/apps/<service>/ (what step 5 writes).
name: build-image

on:
  workflow_call:
    inputs:
      binary:
        description: "Name under cmd/ and of the ECR repository gatepass/<binary> (e.g. skeleton-api)"
        required: true
        type: string
      service:
        description: "Directory under apps/ in the gitops repository (e.g. skeleton); several applications that run the same image are separated by spaces (e.g. \"reservations reservations-consumer\")"
        required: true
        type: string
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build-sign-${{ inputs.binary }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC: AWS login and cosign keyless signing
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Work out the tag and the build time
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/gatepass/${{ inputs.binary }}" >> "$GITHUB_OUTPUT"

      - name: Does this tag already exist in ECR?
        id: existing
        run: |
          d=$(aws ecr describe-images --repository-name "gatepass/${{ inputs.binary }}" \
                --image-ids "imageTag=${{ steps.meta.outputs.tag }}" \
                --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -n "$d" ] && [ "$d" != "None" ]; then echo "digest=$d" >> "$GITHUB_OUTPUT"; echo "found $d"; fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.digest == ''

      - name: Build and push (amd64 + arm64)
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            BINARY=${{ inputs.binary }}
            VERSION=${{ steps.meta.outputs.tag }}
            BUILD_TIME=${{ steps.meta.outputs.created }}

      - name: The digest to deploy
        id: digest
        run: echo "digest=${{ steps.existing.outputs.digest || steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless, by digest)
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}"

      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ inputs.binary }}.spdx.json

      - name: Attach the SBOM as a signed attestation
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}"

  bump-gitops:
    name: pin-in-gitops-${{ inputs.service }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Two releases of the same service must not edit the same file at the same moment.
    concurrency:
      group: bump-${{ inputs.service }}
      cancel-in-progress: false
    steps:
      # GITHUB_TOKEN cannot write to ANOTHER repository, and pull requests opened with it do not
      # start checks. A GitHub App installed only on the gitops repository gives a short-lived token
      # (one hour) with just contents + pull requests write.
      - name: App token for the gitops repository
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gatepass-gitops

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/gatepass-gitops
          token: ${{ steps.app.outputs.token }}
          path: gitops

      - name: Write the pin and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SERVICE: ${{ inputs.service }}
          TAG: ${{ needs.build.outputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd gitops
          # SERVICE may name several applications that run the same image (reservations: the API and
          # its consumer), separated by spaces: every one gets the same pin in the SAME pull request,
          # so they can never run different digests of one release.
          branch="bump/${SERVICE// /-}-${TAG}"
          git config user.name "gatepass-release-bot"
          git config user.email "gatepass-release-bot@users.noreply.github.com"
          changed=0
          for svc in $SERVICE; do
            mkdir -p "apps/${svc}"
            cat > "apps/${svc}/dev.yaml" <<YAML
          # WRITTEN BY THE RELEASE WORKFLOW of gatepass-app. Do not edit by hand.
          # The image deployed in dev: the tag is a label (the commit), the digest decides the bytes.
          # To roll back, revert the pull request that changed this file.
          image:
            tag: ${TAG}
            digest: ${DIGEST}
          YAML
            if ! git diff --quiet -- "apps/${svc}/dev.yaml" || [ -n "$(git ls-files --others --exclude-standard "apps/${svc}/dev.yaml")" ]; then changed=1; fi
          done
          if [ "$changed" = 0 ]; then echo "already pinned, nothing to do"; exit 0; fi
          git switch -c "$branch"
          for svc in $SERVICE; do git add "apps/${svc}/dev.yaml"; done
          git commit -m "Deploy ${SERVICE// / and } ${TAG} to dev"
          git push -u origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY_OWNER/gatepass-gitops" --head "$branch" \
            --title "Deploy ${SERVICE// / and } ${TAG} to dev" \
            --body "Image \`${DIGEST}\` built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}. Signed with cosign (keyless); SBOM attached. Merging deploys it to dev; reverting this pull request rolls it back."
          gh pr merge "$branch" --repo "$GITHUB_REPOSITORY_OWNER/gatepass-gitops" --auto --squash
